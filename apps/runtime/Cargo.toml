[package]
name = "flowtools-runtime"
version = "0.1.0"
edition = "2021"

[features]
standalone = []
bundle-launcher = []

[[bin]]
name = "flowtools"
path = "src/launcher.rs"
required-features = ["bundle-launcher"]

[dependencies]
flowtools-runtime-core = { path = "../../packages/runtime-core" }
serde_json.workspace = true
serde.workspace = true
tokio.workspace = true
sha2.workspace = true
uuid.workspace = true

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.7.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Security_Isolation", "Win32_System_Com", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Registry", "Win32_System_SystemServices", "Win32_System_WindowsProgramming", "Win32_UI_Shell", "Wdk_Storage_FileSystem"] }
