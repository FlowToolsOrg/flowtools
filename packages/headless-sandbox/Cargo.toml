[package]
name = "flowtools-headless-sandbox"
version = "0.1.0"
edition = "2021"
publish = false

# A feasibility harness, deliberately outside the Runtime production workspace.
[workspace]

[[bin]]
name = "flowtools-p22-sandbox-child"
path = "src/child.rs"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[build-dependencies]
cc = "=1.6.0"
sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_WindowsProgramming", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Diagnostics_Debug", "Win32_System_ErrorReporting"] }
