[package]
name = "flowtools-runtime-core"
version = "0.1.0"
edition = "2021"

[dependencies]
serde.workspace = true
serde_json.workspace = true
specta.workspace = true
specta-serde.workspace = true
specta-typescript.workspace = true
sha2.workspace = true
base64 = "=0.22.1"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std"] }
uuid.workspace = true
jsonschema = { version = "=0.33.0", default-features = false }
schemars = { version = "=1.2.1", features = ["derive"] }
rusqlite = { version = "=0.39.0", features = ["bundled", "backup"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_Security_Cryptography"] }
