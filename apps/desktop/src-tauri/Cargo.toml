[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "desktop"

[features]
codegen = ["tauri/test"]

[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["codegen"]

[[test]]
name = "bindings"
path = "tests/bindings.rs"
required-features = ["codegen"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
specta = { version = "=2.0.0-rc.25", features = ["serde_json"] }
specta-typescript = "0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
base64 = "0.22.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tauri-plugin-devtools = "2.0.0"
toasty = { version = "0.7", features = ["sqlite", "jiff"] }
jiff = { version = "0.2.29", features = ["serde"] }
